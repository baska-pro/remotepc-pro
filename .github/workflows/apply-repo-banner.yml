name: Apply Repository Banner

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-repo-banner.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install banner and update README
        shell: bash
        env:
          BANNER_B64: ""
        run: |
          python - <<'PY2'
          from pathlib import Path
          import base64, os, re
          repo = os.environ["GITHUB_REPOSITORY"].split("/")[-1]
          title = " ".join(x.capitalize() for x in repo.split("-"))
          assets = Path("assets"); assets.mkdir(parents=True, exist_ok=True)
          (assets / "banner.webp").write_bytes(base64.b64decode(os.environ["BANNER_B64"]))
          block = (
              "<!-- repo-banner:start -->\n"
              "<p align=\"center\">\n"
              f"  <img src=\"./assets/banner.webp\" alt=\"{title} banner\" width=\"100%\">\n"
              "</p>\n"
              "<!-- repo-banner:end -->\n\n"
          )
          pat = re.compile(r"<!-- repo-banner:start -->.*?<!-- repo-banner:end -->\s*", re.S)
          readmes = [Path("README.md"), Path("README.id.md"), Path("README.en.md")]
          found = False
          for r in readmes:
              if r.exists():
                  found = True
                  text = r.read_text(encoding="utf-8")
                  text = pat.sub("", text, count=1).lstrip("\ufeff\r\n")
                  r.write_text(block + text, encoding="utf-8")
          if not found:
              Path("README.md").write_text(block + f"# {title}\n\nRepository **{repo}** by [baska-pro](https://github.com/baska-pro).\n", encoding="utf-8")
          Path(".github/workflows/apply-repo-banner.yml").unlink(missing_ok=True)
          PY2
      - name: Commit banner and documentation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: add repository banner"
          git push
